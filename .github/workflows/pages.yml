name: Release-Seite

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tool/release_catalog.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published, unpublished, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'release' && format('github-pages-release-{0}', github.run_id) || 'github-pages' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Release events run from a tag. The Pages environment allows only main.
      - name: Dispatch Pages deployment on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
  build:
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Read published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            python3 tool/release_catalog.py > dist/releases.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish Release-Seite
        id: deploy
        uses: actions/deploy-pages@v5
